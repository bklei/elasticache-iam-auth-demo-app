# nginx configuration for ElastiCache IAM authentication
# This configuration demonstrates how to use the Lua modules with IRSA

# Load required Lua modules
lua_package_path "/path/to/your/lua/modules/?.lua;;";

# Initialize AWS configuration in the init phase
# This is crucial for IRSA to work properly
init_by_lua_block {
    -- Initialize AWS configuration to pick up IRSA environment variables
    local redis_demo = require("redis_iam_demo")
    redis_demo.init()
}

server {
    listen 80;
    server_name localhost;
    
    # Health check endpoint
    location /health {
        content_by_lua_block {
            ngx.say("OK")
        }
    }
    
    # Test Redis connection with IAM auth
    location /test-redis {
        content_by_lua_block {
            local redis_demo = require("redis_iam_demo")
            
            -- Configuration - replace with your actual values
            local config = {
                redis_host = "your-elasticache-endpoint.cache.amazonaws.com",
                redis_port = 6379,
                user_id = "your-iam-user-id",
                replication_group_id = "your-replication-group-id", 
                region = "us-west-2",  -- Will use AWS_REGION env var if not specified
                tls = true  -- Enable TLS for ElastiCache
            }
            
            local success, result = redis_demo.redis_example(config)
            
            if success then
                ngx.status = 200
                ngx.say("Redis connection successful!")
                ngx.say("Operations performed: " .. result.operations)
                ngx.say("GET result: " .. (result.get_result or "null"))
                ngx.say("PING result: " .. (result.ping_result or "null"))
            else
                ngx.status = 500
                ngx.say("Redis connection failed: " .. (result or "unknown error"))
            end
        }
    }
    
    # Continuous Redis connection test
    location /test-redis-continuous {
        content_by_lua_block {
            local redis_demo = require("redis_iam_demo")
            
            local config = {
                redis_host = "your-elasticache-endpoint.cache.amazonaws.com",
                redis_port = 6379,
                user_id = "your-iam-user-id",
                replication_group_id = "your-replication-group-id",
                region = "us-west-2",
                tls = true,
                sleep_time = 2,      -- 2 seconds between connections
                max_iterations = 5   -- Test 5 connections
            }
            
            local successful_connections = redis_demo.continuous_test(config)
            
            ngx.status = 200
            ngx.say("Continuous test completed")
            ngx.say("Successful connections: " .. successful_connections .. "/5")
        }
    }
    
    # Generate IAM auth token endpoint (for debugging)
    location /generate-token {
        content_by_lua_block {
            local IAMAuthTokenRequest = require("iam_auth_token_request")
            local aws_config = require("resty.aws.config")
            
            -- Get parameters from query string
            local args = ngx.req.get_uri_args()
            local user_id = args.user_id
            local replication_group_id = args.replication_group_id
            local region = args.region or "us-west-2"
            
            if not user_id or not replication_group_id then
                ngx.status = 400
                ngx.say("Missing required parameters: user_id, replication_group_id")
                return
            end
            
            -- Get AWS credentials
            local config = aws_config.global
            local credentials_provider = config.credentials
            
            if not credentials_provider then
                ngx.status = 500
                ngx.say("No AWS credentials provider available")
                return
            end
            
            local credentials = credentials_provider:resolveCredentials()
            if not credentials then
                ngx.status = 500
                ngx.say("Failed to resolve AWS credentials")
                return
            end
            
            -- Generate token
            local iam_auth_request = IAMAuthTokenRequest.new(user_id, replication_group_id, region)
            local token = iam_auth_request:to_signed_request_uri(credentials)
            
            if token then
                ngx.status = 200
                ngx.header.content_type = "text/plain"
                ngx.say(token)
            else
                ngx.status = 500
                ngx.say("Failed to generate IAM auth token")
            end
        }
    }
    
    # Show AWS environment info (for debugging IRSA setup)
    location /aws-info {
        content_by_lua_block {
            ngx.header.content_type = "application/json"
            
            local info = {
                aws_region = os.getenv("AWS_REGION"),
                aws_default_region = os.getenv("AWS_DEFAULT_REGION"),
                aws_role_arn = os.getenv("AWS_ROLE_ARN"),
                aws_web_identity_token_file = os.getenv("AWS_WEB_IDENTITY_TOKEN_FILE"),
                aws_sts_regional_endpoints = os.getenv("AWS_STS_REGIONAL_ENDPOINTS")
            }
            
            local cjson = require("cjson")
            ngx.say(cjson.encode(info))
        }
    }
}
